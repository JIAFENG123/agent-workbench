<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Slate to Cyber Navy -->
    <linearGradient id="aw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Core Gradient: Electric Cyan to Indigo to Neon Violet -->
    <linearGradient id="aw-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Accent Highlights -->
    <linearGradient id="aw-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="aw-radial" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#aw-bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#aw-radial)"/>
  
  <!-- Subtle Border Ring -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Geometric AW Nexus Symbol: An ascending Apex "A" bridging with dynamic "W" quantum arms -->
  <!-- Left Wing (W outer to upper peak) -->
  <path d="M14 44 L25 21 L32 35" stroke="url(#aw-core)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Wing (upper peak to W outer) -->
  <path d="M50 44 L39 21 L32 35" stroke="url(#aw-core)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Inner W Pivot -->
  <path d="M25 44 L32 33 L39 44" stroke="url(#aw-glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Apex Luminous Beacon / Agent Spark -->
  <circle cx="32" cy="14" r="5" fill="#38bdf8"/>
  <circle cx="32" cy="14" r="2.2" fill="#ffffff"/>
  
  <!-- Satellite Nodes on Base Corners -->
  <circle cx="14" cy="44" r="2.8" fill="#38bdf8"/>
  <circle cx="50" cy="44" r="2.8" fill="#c084fc"/>
</svg>
